# Реестр поддерживаемых технологий (Development Capabilities)
# Этот файл обновляется Operations-отделом и определяет, какие агенты-разработчики доступны.
# Стек спроектирован для минимизации когнитивной нагрузки на агентов (Agent-Driven Development)
# и сокращения количества команд разработчиков.

frontend_and_client:
  - name: 'Next.js (React / TypeScript)'
    agent_available: 'Да'
    notes: 'Используется СТРОГО для контентных, публичных доменов (SEO, маркетплейсы, витрины), где раздача определяется данными и требуется Server-Side Rendering (SSR). Легко пишется ИИ-агентами.'
  - name: 'Flutter (Dart)'
    agent_available: 'Да'
    notes: 'Единый UI-движок для Mobile, Desktop и Web-приложений. Выбран для утилитарных инструментов (SaaS, Local-first), где важна высочайшая производительность, отзывчивость интерфейса и доступ к железу устройства, а не SEO.'

backend_and_core:
  - name: 'Go (Golang)'
    agent_available: 'Да'
    notes: 'Базовый язык для API, высоконагруженных сервисов, CLI и децентрализованных P2P-нод. Выбран за минимализм, строгую типизацию и сверхнизкую вероятность галлюцинаций у LLM (Ultra-Low ADD Complexity).'

ai_and_analytics:
  - name: 'Python'
    agent_available: 'Да'
    notes: "Стандарт для ML, аналитики данных и пайплайнов оркестрации агентов. Является 'родным' языком для LLM (Ultra-Low ADD Complexity)."

embedded_and_iot:
  - name: 'C / C++'
    agent_available: 'Да'
    notes: 'Используется ИСКЛЮЧИТЕЛЬНО для IoT (прошивки микроконтроллеров ESP32, STM) и ультра-низкоуровневых драйверов (взаимодействие с датчиками, Physical Focus). Агенты хорошо пишут процедурный C++ для IoT, но избегаем его на бэкенде ради безопасности памяти.'

web3_and_crypto:
  - name: 'Solidity (EVM)'
    agent_available: 'Да'
    notes: 'Используется исключительно при строгой необходимости on-chain логики (DeFi, смарт-контракты). Требует ручного Security-аудита (Medium ADD Complexity).'
