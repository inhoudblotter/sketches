metadata:
  last_updated: '2026-07-18'
  requested_by: 'system_initialization'
  note: 'Данные требуют актуализации и проверки. В будущем предполагается подключение по OpenAPI к провайдерам для запроса и точного расчёта цен.'
  usage_note: 'Этот файл — только индекс (summary + pricing_file путь). Он НЕ содержит точных цифр цен по тирам. Перед любым расчётом COGS/amortized-стоимости ОБЯЗАТЕЛЬНО читать сам файл из pricing_file (departments/discovery/playbooks/pricing/{provider}.yaml) — там реальные price_rub/price_eur по тирам. Цитировать в артефактах строку из pricing/{provider}.yaml, не из индекса.'

categories:
  compute:
    description: "Виртуальные серверы, облачные вычисления, VPS/VDS"
    providers:
      - id: beget
        name: "Beget"
        summary: "Бюджетные VPS в РФ, Латвии и Казахстане. От ~330 руб/мес. Хорошо для MVP."
        pricing_file: pricing/beget.yaml
      - id: datacheap_ru
        name: "DataCheap (Russia)"
        summary: "VDS на NVMe (РФ) с защитой DDoS. От ~350 руб/мес."
        pricing_file: pricing/datacheap_ru.yaml
      - id: datacheap_nl
        name: "DataCheap (Netherlands)"
        summary: "VDS на NVMe (Нидерланды) с защитой DDoS. От ~350 руб/мес."
        pricing_file: pricing/datacheap_nl.yaml
      - id: datacheap_cz
        name: "DataCheap (Czechia)"
        summary: "VDS на NVMe (Чехия) с защитой DDoS. От ~350 руб/мес."
        pricing_file: pricing/datacheap_cz.yaml
      - id: hostkey
        name: "Hostkey"
        summary: "VPS во множестве локаций. Хорош для MVP (от 285 руб/мес), но с ограниченным трафиком (3 ТБ)."
        pricing_file: pricing/hostkey.yaml
      - id: selectel
        name: "Selectel"
        summary: "Высоконадежные облачные серверы и выделенные серверы (Enterprise IaaS)."
        pricing_file: pricing/selectel.yaml
      - id: yandex_cloud
        name: "Yandex Cloud"
        summary: "Крупнейший Enterprise IaaS в РФ. Масштабируемые ВМ."
        pricing_file: pricing/yandex_cloud.yaml
      - id: vk_cloud
        name: "VK Cloud"
        summary: "Enterprise IaaS от VK. Эластичные инстансы."
        pricing_file: pricing/vk_cloud.yaml

  containers:
