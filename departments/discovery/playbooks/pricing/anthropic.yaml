provider: Anthropic

external_apis:
  - service: 'LLM API'
    model: 'claude-fable-5'
    input_price_1m_usd: 10.0
    cache_write_5m_1m_usd: 12.50
    cache_write_1h_1m_usd: 20.0
    cache_hit_1m_usd: 1.0
    output_price_1m_usd: 50.0

  - service: 'LLM API'
    model: 'claude-mythos-5'
    input_price_1m_usd: 10.0
    cache_write_5m_1m_usd: 12.50
    cache_write_1h_1m_usd: 20.0
    cache_hit_1m_usd: 1.0
    output_price_1m_usd: 50.0

  - service: 'LLM API'
    model: 'claude-opus-4.8'
    input_price_1m_usd: 5.0
    cache_write_5m_1m_usd: 6.25
    cache_write_1h_1m_usd: 10.0
    cache_hit_1m_usd: 0.50
    output_price_1m_usd: 25.0

  - service: 'LLM API'
    model: 'claude-sonnet-5'
    description: 'Introductory pricing through August 31, 2026'
    input_price_1m_usd: 2.0
    cache_write_5m_1m_usd: 2.50
    cache_write_1h_1m_usd: 4.0
    cache_hit_1m_usd: 0.20
    output_price_1m_usd: 10.0

  - service: 'LLM API'
    model: 'claude-haiku-4.5'
    input_price_1m_usd: 1.0
    cache_write_5m_1m_usd: 1.25
    cache_write_1h_1m_usd: 2.0
    cache_hit_1m_usd: 0.10
    output_price_1m_usd: 5.0

features:
  - feature: 'Batch API'
    discount: '50% off base input and output token prices'
  - feature: 'Prompt Caching'
    description: 'Automatic or explicit caching (5m and 1h TTLs) with discounted read hits.'
