# Pitch Deck Template (Blue Ocean & Cultural Anthropology Edition)
# Контракт для генерации инвестиционной презентации на основе глубоких методологий проекта.
# 
# ИНСТРУКЦИЯ ПО ЗАПОЛНЕНИЮ:
# - Отбросьте стандартный стартап-булшит. Используйте оптику Blue Ocean (ERRC Matrix) и Actor-Network Theory.
# - Продукт должен презентоваться как активный социальный актор, разрешающий Cultural Tension.

title_slide:
  title: "[Название: Без Buzzwords]"
  subtitle: "[Слоган: Какой социальный невроз мы разрешаем?]"

mandatory_slides:
  problem:
    # Опишите понятную рыночную "боль", но копните глубже до уровня Cultural Tension и Identity Myth.
    # Что не так с текущей социальной или технической нормой? Какой острый невроз мы атакуем?
    # Anti-Pattern: Запрещено выдумывать проблему под готовую технологию (SISP).
    content: |
      - Рыночная боль: За что пользователи уже готовы платить, но не получают должного качества?
      - Cultural Tension: Какой социокультурный сдвиг стоит за этой болью?
      - Status Quo (Tar Pits): Почему классические решения конкурентов обречены на провал?

  solution:
    # Опишите Value Innovation через ERRC (Eliminate, Reduce, Raise, Create).
    # Как продукт принудительно навязывает Behavioral Shift (новую поведенческую норму)?
    content: |
      - Продукт: В чём магия решения (Aha-moment) и как оно работает в одном предложении?
      - Behavioral Shift: Какую новую норму система диктует пользователю?
      - ERRC: От каких стандартных функций мы радикально отказались (Eliminate), чтобы снизить издержки и максимизировать ключевую ценность?

  market_and_competition:
    # Комбинация классического анализа (TAM/SAM/SOM) и оптики Blue Ocean.
    # Докажите наличие Cultural Moat (субкультурной лояльности), которую гиганты не скопируют.
    content: |
      - Объем рынка: Оценка TAM, SAM, SOM (в деньгах или пользователях).
      - Blue Ocean: Кто наши не-клиенты? Почему мы не боимся прямых конкурентов (Красный Океан)?
      - Cultural Moat: Как наша архитектура защищается от коммодитизации и клонирования корпорациями?

  go_to_market:
    # Баланс между классическим CAC/LTV и Day-0 Viral Lens.
    # В чём заключается наша Inherent Virality (внутренняя виральность)?
    content: |
      - Каналы привлечения: Стандартные каналы (SEO, B2B Sales) и оценка юнит-экономики (CAC, LTV).
      - Day-0 Inherent Virality: Какие нефункциональные "Magnet Features" заставят юзера привести друзей ради статуса?
      - Протокольная дистрибуция: Как мы "паразитируем" на других сетях (Ecosystem Symbiosis)?

  risks:
    # Дистилляция investment_memo.md §4 Red Team Critique в короткие буллиты для инвестора.
    # Это НЕ то же самое, что автоматический слайд Execution Risks — тот берёт только
    # critical_errata.yaml (блокеры прошлых этапов) и показывает "Clear Path to Execution",
    # если errata пуст, даже если в самом Red Teaming аудите (Шаг 5) найдены реальные находки.
    # Обязательно перенеси сюда находки §4, если они есть — иначе инвестор не увидит их вовсе.
    # Anti-Pattern: не смягчай/не растворяй находку в общих словах ("есть риски") — конкретика.
    content: |
      - Что не провалидировано (Skin in the Game): Есть ли у committed-потоков выручки реальное поведенческое подтверждение (депозиты/предзаказы), или только proxy-расчёты (The Mom Test)?
      - Что съест ресурсы: Является ли объём MVP (Size Bucket, high-risk SP) реалистичным, и окупается ли он потенциальной маржой и прогнозируемой выручкой?
      - Что сломается первым: Какой конкретный технический/продуктовый узел (не размытая фраза "есть риски") подведёт раньше всего?

  final_verdict:
    # Финальный аккорд перед разработкой и инвестициями. Сухая выжимка §8 Final Verdict & Lens Synthesis из investment_memo.md.
    # Anti-Pattern: НЕ дублируй слайд с рисками. Пиши честный итог (Go/No-Go). Если проект нужно развернуть (Pivot) или закрыть — говори прямо.
    content: |
      - Вердикт (Go / No-Go / Pivot): Жёсткое и честное решение — запускаем в работу, требуем разворота, или убиваем проект?
      - Синтез (Lens Synthesis): Главный философский/архитектурный аргумент, определяющий вердикт (выживаемость в Splinternet, наличие Cultural Moat, защита от ИИ-коммодитизации и т.д.).
      - Следующий шаг (Next Steps): Что конкретно требуется от команды прямо сейчас (инвестиции, смена архитектуры, доп. исследование)?

optional_slides:
  network_effects_and_decentralization:
    # Только для Trustless систем.
    # Опишите Immutable Trust Topology: как граф защищается от стагнации элит и Eclipse Attacks?
    content: |
      - Trustless Resilience: Как ZKP или Event Sourcing заменяют мутабельную репутацию.
      - Защита графа: Математическая энтропия статусов (Exponential Decay), предотвращающая накопление власти у OG.
