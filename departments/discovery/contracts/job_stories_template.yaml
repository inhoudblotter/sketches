author_agent: 'po-strategist-sub'
# Job Stories YAML Contract

domain: 'название_домена'
epic: 'название_эпика_или_поддомена'
epic_type: 'core' # ОБЯЗАТЕЛЬНО одно из: core, growth, monitoring, promo (growth/monitoring/promo — только для эпика, который реально закрывает эту обязательную роль; для всех остальных — 'core').
description: 'Краткое описание бизнес-задачи этого эпика.'

epic_requirements:
  platforms: ['Например: web_admin, api']
  is_headless: false # Укажи true, если целевые платформы не имеют UI
  offline_first: false # Требуется ли локальная работа без сети
  events_to_handle:
    - 'Например: payment_failed (события отказов/ошибок, специфичные для эпика)'
  business_constraints:
    - 'Например: жесткий rate limit (бизнес-ограничения для логики)'

stories:
  - id: '[Любой уникальный ID]'
    title: 'Короткое название сценария'
    situation: '[Опиши триггер или контекст, начиная с "Когда". Например: Когда я получаю ошибку оплаты]'
    motivation: '[Опиши намерение, начиная с "я хочу". Например: я хочу увидеть причину отказа]'
    outcome: '[Опиши ожидаемый результат, начиная с "чтобы". Например: чтобы быстро исправить данные карты]'
    pain_level: 'High' # Critical, High, Medium, Low
    is_standard_crud: false # Укажи true, если история тривиальна (простое создание/чтение/обновление/удаление без сложной бизнес-логики)
    metrics:
      - 'Метрика 1 (например: сокращение MTTR)'

  - id: '[Любой уникальный ID]'
    title: 'Изучение истории запусков'
    situation: 'Когда мне нужно проверить работу системы за последние сутки'
    motivation: 'я хочу отфильтровать список запусков по статусу Ошибка'
    outcome: 'чтобы быстро локализовать массовые сбои в интеграциях'
    pain_level: 'High'
    metrics:
      - 'Сокращение времени на поиск инцидента'
