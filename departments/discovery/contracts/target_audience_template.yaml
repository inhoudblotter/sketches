author_agent: 'po-strategist'
# Target Audience YAML Contract
# Только внешние потребители продукта (люди и машины).
# Операционные акторы (операторы доменов) определяются в
# domains_manifest.yaml → operational_actors и денормализуются
# в domain_manifest.yaml каждого домена — НЕ здесь.

personas:
  - id: '[Название персоны, например: regular_user]'
    name: '[Имя или собирательный образ. Например: Активный фрилансер]'
    description: '[Описание сегмента. Например: Работает сам на себя, нуждается в простой отчетности]'
    pain_points:
      - '[Боль. Например: Тратит много времени на выставление счетов]'
    jtbd_motivations:
      - '[Мотивация. Например: Я хочу, чтобы счета выставлялись автоматически]'
    subculture_and_lifestyle:
      - '[Лайфстайл, рутина, идеалы, ценности и сленг. Например: Андеграундная уличная культура, ценят анонимность, сленг: "тэги, споты, закрасить"]'
    magnet_features:
      - '[Виральная крючковая фича, идеально бьющая в субкультуру. Например: Виртуальная стена для граффити, где можно безнаказанно закрашивать чужие работы ради славы]'
    cultural_tension:
      - '[Социокультурная тревога или сдвиг, который мы лечим (Дуглас Холт). Например: Эпидемия одиночества в мегаполисе, усталость от "пластикового" корпоративного общения]'
    behavioral_shift:
      - '[Новая социальная норма, которую продукт диктует обществу (Actor-Network Theory). Например: Навязывает культуру спонтанных встреч вместо долгих переписок]'

machine_personas:
  # Небиологические потребители: программы, скрипты, AI-агенты, IoT/физические устройства.
  # У machine_persona нет собственной мотивации — JTBD-ценность всегда принадлежит owning_actor
  # (id из `personas` или `operational_actors`), устройство/агент — лишь канал реализации.
  - id: '[Название агента/устройства, например: search_agent или warehouse_temp_sensor]'
    name: '[Роль. Например: Агрегатор контента / Датчик температуры склада]'
    machine_type: '[ai_agent | software_client | iot_device]'
    owning_actor: '[id персоны или operational_actor, чью JTBD-ценность реализует этот machine_persona. Например: regular_user]'
    consumption_method: '[Канал потребления. ai_agent/software_client: MCP Server, REST API. iot_device: протокол — MQTT, BLE GATT, CoAP, LoRaWAN]'
    data_requirements:
      - '[Специфичные требования к данным/командам. Например: Нужна строгая типизация в JSON, без UI-элементов]'
    physical_constraints:
      # Заполняется ТОЛЬКО для machine_type: iot_device. Для ai_agent/software_client — пустой список [].
      - '[Например: автономное питание (батарея 2 года), offline-first, задержка команды < 200ms]'
