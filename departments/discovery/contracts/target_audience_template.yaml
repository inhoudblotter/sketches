author_agent: 'audience-scout'
# Target Audience YAML Contract
# Описание целевой аудитории и персон.

personas:
  - id: '[Название персоны, например: regular_user]'
    name: '[Имя или собирательный образ. Например: Активный фрилансер]'
    description: '[Описание сегмента. Например: Работает сам на себя, нуждается в простой отчетности]'
    pain_points:
      - '[Боль. Например: Тратит много времени на выставление счетов]'
    jtbd_motivations:
      - '[Мотивация. Например: Я хочу, чтобы счета выставлялись автоматически]'
    subculture_and_lifestyle:
      - '[Лайфстайл, рутина, идеалы, ценности и сленг. Например: Андеграундная уличная культура, ценят анонимность, сленг: "тэги, споты, закрасить"]'
    magnet_features:
      - '[Виральная крючковая фича, идеально бьющая в субкультуру. Например: Виртуальная стена для граффити, где можно безнаказанно закрашивать чужие работы ради славы]'
    cultural_tension:
      - '[Социокультурная тревога или сдвиг, который мы лечим (Дуглас Холт). Например: Эпидемия одиночества в мегаполисе, усталость от "пластикового" корпоративного общения]'
    behavioral_shift:
      - '[Новая социальная норма, которую продукт диктует обществу (Actor-Network Theory). Например: Навязывает культуру спонтанных встреч вместо долгих переписок]'

machine_personas:
  - id: '[Название агента, например: search_agent]'
    name: '[Роль агента. Например: Агрегатор контента]'
    consumption_method: '[Как потребляет данные. Например: MCP Server, REST API]'
    data_requirements:
      - '[Специфичные требования. Например: Нужна строгая типизация в JSON, без UI-элементов]'
