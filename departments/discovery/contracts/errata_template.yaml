# Errata (Список блокеров и нарушений плейбуков)
# Контракт для регистрации неразрешимых архитектурных и идеологических противоречий.
#
# ИНСТРУКЦИЯ ПО ЗАПОЛНЕНИЮ:
# - Используйте этот файл ТОЛЬКО для нарушений строгих ограничений из playbooks (Anti-Patterns) или при обнаружении противоречий между входными данными.
# - Примеры: SISP (Технология ради технологии), Cloud-Only Trap (Слепая вера в облака),
#   UI-First Bias (Отсутствие Agentic API), The Mom Test Anti-Pattern (опросы вместо действий),
#   Необоснованный Киберпанк (радикальный P2P в ущерб UX без веских архитектурных/геополитических причин).

- id: 'ERR-001'
  description: |
    [Суть идеологического или архитектурного конфликта.
    Например: "Продукт скатывается в SaaS-Зависимость (Cloud-Only Trap), игнорируя 
    требование Data Sovereignty из Post-Internet плейбука".]
  severity: 'CRITICAL | HIGH | MEDIUM' # CRITICAL — нарушен строгий Anti-Pattern.
  domain: '[В каком домене или контексте возникла проблема?]'
  status: 'open | resolved' # по умолчанию open.
  resolution: |
    [Что требуется от Архитектора?
    Например: "Необходим принудительный сдвиг к Local-First архитектуре, либо явное
    одобрение от Product Strategist на принятие риска централизации".]
  patch_ref: '[Опционально: имя файла в patches/ (например add-monitoring-epic.yaml), если резолюция этой errata-записи делегирована саб-агенту через Patch — см. departments/operations/playbooks/skill-patch-protocol.md]'
