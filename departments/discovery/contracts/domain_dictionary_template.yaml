# Domain Dictionary YAML Contract
# Этот формат описывает бизнес-сущности домена.
# ЗАПРЕЩЕНО использовать технические типы данных (UUID, varchar, boolean). Используй семантические типы (Identifier, Text, Status Flag).

domain: 'название_домена'

entities:
  - name: 'EntityName'
    description: 'Описание бизнес-смысла сущности.'
    type: 'AggregateRoot' # или Entity, ValueObject
    attributes:
      - name: 'attribute_name'
        semantic_type: 'Identifier' # Не UUID!
        description: 'Для чего используется в бизнесе'
        is_required: true
    relationships:
      - type: 'has_many' # belongs_to, has_one
        target: '[domain].OtherEntity' # ВНИМАНИЕ: квадратные скобки это плейсхолдер. Пиши реальный домен, например 'billing.Invoice'
        description: 'Бизнес-смысл связи'

glossary:
  - term: 'Специфичный термин'
    definition: 'Объяснение термина на языке бизнеса'
