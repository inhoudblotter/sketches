# Domains Manifest YAML Contract
# Реестр всех бизнес-доменов продукта.
strategic_insight: '[Свободное поле для стратегических инсайтов или ограничений. Например: Это CRUD-утилита, флоу не нужны]'

domains:
  - id: '[Название домена. Например: billing]'
    name: '[Человекочитаемое название. Например: Управление подписками]'
    description: '[Краткая суть домена. Например: Обработка оплат и генерация инвойсов]'
    data_residency: '[Где хранятся данные. Например: Client-Only (Local-first), Federated Node, Cloud]'
    target_roles:
      - '[Целевая роль. Например: Администратор]'
    key_entities:
      - '[Сущность. Например: Invoice]'
