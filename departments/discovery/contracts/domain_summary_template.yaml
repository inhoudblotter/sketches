author_agent: 'po-strategist-sub'
# Domain Summary YAML Contract
# Используется для Agent-to-Agent коммуникации (Map-Reduce), чтобы передать агрегированную информацию о домене.
# ЗАПРЕЩЕНО добавлять "воду" и длинные эссе. Пиши строго по формату.

domain: 'название_домена'
executive_summary: '[Краткая выжимка из 2-3 предложений. Например: Домен отвечает за биллинг, генерацию инвойсов и интеграцию с внешним платёжным процессором.]'
strategic_trajectory: '[Кратко опиши, как домен будет развиваться. Например: На старте фокусируемся на базовом биллинге, затем добавляем рекуррентные подписки]'

# ВНИМАНИЕ: 'EntityName' — это плейсхолдер. Не используй квадратные скобки или префиксы домена в реальном значении. (Пиши entity: 'Account', а не entity: '[domain].Account').
# Сущности, которые этот домен ПУБЛИКУЕТ для использования другими доменами.
exports:
  - entity: 'EntityName'
    description: '[Зачем эта сущность нужна потребителям. Например: Основной агрегат заказа, потребляется доменами shipping и notifications]'

# Сущности из ДРУГИХ доменов, от которых этот домен зависит.
imports:
  - from_domain: 'source_domain'
    entity: 'EntityName'
    reason: '[Зачем импортируется. Например: Привязка инвойса к профилю пользователя]'

epics:
  - epic_id: 'название_эпика'
    focus: '[Краткая суть эпика, например: Обработка разовых платежей]'

domain_metrics:
  kpi:
    - name: '[Название KPI домена. Например: Login Success Rate]'
      description: '[Ожидаемый бизнес-результат домена]'
  critical_events:
    - event_name: '[Название события. Например: 2fa_failed]'
      business_impact: '[Влияние. Например: Блокировка пользователя]'
