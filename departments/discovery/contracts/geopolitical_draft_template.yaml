# Geopolitical Draft Template (Splinternet & Resilience Edition)
# Контракт для оценки архитектурной устойчивости в условиях фрагментации интернета (Splinternet).
#
# ИНСТРУКЦИЯ ПО ЗАПОЛНЕНИЮ:
# - Презумпция: зависимость от AWS/Cloudflare — это уязвимость. Инфраструктурная изоляция — это норма.
# - Anti-Pattern: Запрещен "Наивный Глобализм" (вера в единый интернет).
# - Anti-Pattern: Запрещен "Необоснованный Киберпанк" (Over-Decentralization). Радикальная децентрализация транспорта (P2P, Tor/I2P) не должна внедряться "на всякий случай". Ее использование легитимно, только если 1) математический риск блокировок > 80%, ИЛИ 2) это дает радикальное снижение инфраструктурных костов (Local-First, снижение Cloud-зависимости), при условии, что деградация UX остается в допустимых пределах.

splinternet_paranoia: |
  [Infrastructure Vulnerability: Как продукт сохраняет Graceful Degradation 
  при изоляции региона? Опишите резервные каналы, локальные сети, отказ от глобальных CDN.]
access_resilience: |
  [Векторы поиска: Domain fronting, mesh-сети, Local-First архитектура, CRDT.
  Важно: Учитывайте порог сложности UX. Использование радикальной децентрализации оправдано только при балансе между защищенностью, стоимостью и удобством пользователя.]
ideological_neutrality: |
  [Protocol Neutrality: Как архитектура остается индифферентной к цензуре и локальным законам? 
  Используется ли децентрализованное управление (Self-Regulation / DAO) для отвязки от единой юрисдикции?]

risks:
  - category: "Censorship / Sovereign Enclaves / DPI"
    description: "[Сценарий блокировки магистральных каналов связи или санкционного отключения.]"
    severity: "HIGH | MEDIUM | LOW"
    mitigation_strategy: "[Технический ответ: Obfuscation, ZKP, Federation (ActivityPub), on-premise fallback.]"

strategic_recommendation: |
  [Финальный вердикт: Требуется ли переход к радикальной транспортной децентрализации (Tor/I2P/P2P)?
  Обоснуйте ответ не только геополитическими рисками (вероятность блокировки), но и экономической целесообразностью и влиянием на UX массового пользователя.]
