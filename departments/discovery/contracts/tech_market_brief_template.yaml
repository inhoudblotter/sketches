# Tech Market Brief (Выжимка из Market Context для технических скаутов)
# Формируется агентом business-synthesizer для ограничения контекста.

audience_technical_literacy: '[Например: Высокая, крипто-энтузиасты / Низкая, масс-маркет]'
expected_load:
