# Tech Constraints YAML Contract
# Синтезируется Tech Synthesizer'ом на основе исследований DevOps и Tech Scout.

# Каждое поле — строка ИЛИ список строк (когда компонент реально состоит из
# нескольких технологий, например Postgres + Redis, или web/mobile на разных
# фреймворках). Не разбивай на список то, что по факту одна технология.
technology_stack:
  frontend: '[Language/Framework, может быть null, если продукт headless — потребители только machine_personas (ai_agent/software_client/iot_device), UI отсутствует. Список — если несколько клиентов]'
  backend: '[Language/Framework, может быть null для Local-First]'
  database: '[DB Type, e.g., PostgreSQL, Redis, может быть null для P2P. Список — если используется несколько СУБД]'
  infrastructure: '[Hosting/Deployment, e.g., Vercel, AWS EKS, VPS. Может быть null для чистого Local-First/P2P без серверной инфраструктуры — тогда см. p2p_network_layer]'
  p2p_network_layer: '[Опционально: Описание Gossip, реле, Federated Trackers]'
  data_replication_model: '[Опционально: CRDT, Event Sourcing, SQLite In-Memory]'
  cryptographic_identity: '[Опционально: Zero-Trust аутентификация, Ed25519]'

resource_quotas_per_user:
  storage_gb: '[Ожидаемый объем хранилища на 1 пользователя в месяц, GB. Например: 0.5]'
  database_reads_per_month: '[Ожидаемое количество чтений, шт. Например: 10000]'
  database_writes_per_month: '[Ожидаемое количество записей, шт. Например: 2000]'
  egress_bandwidth_gb: '[Ожидаемый исходящий трафик на пользователя, GB. Например: 2.0]'
  external_api_calls:
    - provider: '[Например: openai]'
      metric: '[Например: tokens_per_month]'
      amount: '[Например: 50000]'

compliance_flags:
  - '[Например: GDPR]'
  - '[Например: ФЗ-152]'
  - '[Например: AGPL-blocked]'

growth_path:
  - component: '[Например: Database]'
    trigger: '[Метрика/порог из business_scaling_triggers или deployment_strategy.md#Growth Path. Например: >80 concurrent DB connections]'
    action: '[Следующий шаг. Например: PgBouncer connection pooler]'
    rewrite_cost: '[Что переписывается / что переживёт переход без рефакторинга]'

maintainability_notes: '[Какой эксплуатационной экспертизы требует стек и что произойдёт без неё (команда 1-2 человека, без выделенного SRE/DBA). Источник: deployment_strategy.md#Maintainability Note]'

# Перенос (Tracer Pattern) по каждой фиче из секций data_sourcing.md — источник для ops-scout
# (Moderation & Quality Signal → Functional Coverage Matrix) и cogs-scout (объём/лицензия → COGS).
# Пусто/отсутствует, если data_sourcing.md не содержит фич, требующих внешних/пользовательских данных.
# ВАЖНО: `domain`/`feature_id` ОБЯЗАНЫ быть реальной парой из соответствующего
# workspace/discovery/domains/{domain}/epics/*/features.yaml (поле `id`) — линтер
# (discovery-linter tech-constraints) хардфейлит пары, не резолвящиеся в реальную фичу.
# Возьми их из `data_sourcing.md`, где data-miner обязан цитировать `[domain/feature_id]`
# по результату `query-discovery features`, а не придумывать название заново.
data_sourcing:
  - domain: '[Домен, которому принадлежит фича. Например: billing]'
    feature_id: '[Точный `id` фичи из её features.yaml. Например: card_payment]'
    feature_name: '[Человекочитаемое название, только для чтения — traceability идёт по domain+feature_id, не по этому полю]'
    automation_verdict: '[automated | semi-automated | manual-required. Источник: data_sourcing.md#Automation Verdict]'
    moderation_signal: '[Объём новых записей + тип проверки. Например: ~200 записей/день, ручная модерация контента. "не требуется", если секция это указывает]'
    legal_flags:
      - '[Явный риск лицензии/ToS/PII без вердикта. Источник: data_sourcing.md#Legal Flags. Пусто, если "не выявлено"]'

strategic_insight: '[Чем мы жертвуем ради этой архитектуры? Например: Жертвуем скоростью разработки ради дешевизны VPS]'
